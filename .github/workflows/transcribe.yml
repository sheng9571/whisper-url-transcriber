name: Transcribe Audio

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direct download URL"
        required: true
        type: string

jobs:
  transcribe:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output /tmp/audio \
            "$AUDIO_URL"

          echo "Downloaded audio:"
          ls -lh /tmp/audio

      - name: Pull Whisper image
        run: |
          docker pull "$IMAGE:large-v3"

      - name: Transcribe
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          docker run --rm \
            -v "/tmp/audio:/data/audio:ro" \
            -v "$GITHUB_WORKSPACE/output:/output" \
            "$IMAGE:large-v3" \
            "/data/audio" \
            --output "/output/transcript.txt"

      - name: Show result
        if: success()
        run: |
          ls -lh output/transcript.txt
          echo "Transcript lines:"
          wc -l output/transcript.txt

      - name: Upload transcript
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: output/transcript.txt
          retention-days: 1
          if-no-files-found: error
