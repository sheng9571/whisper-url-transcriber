name: Build Whisper Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - transcribe.py
      - .github/workflows/build.yml

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:large-v3" \
            -t "$IMAGE:${GITHUB_SHA}" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE:large-v3"
          docker push "$IMAGE:${GITHUB_SHA}"
